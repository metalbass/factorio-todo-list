[mod-setting-description]
todolist-show-button=När detta är aktiverat visas alltid knappen ”Att göra-lista” uppe till vänster.\nNär det är inaktiverat kan listan bara öppnas med sitt kortkommando (som standard Skift+T).
todolist-show-log=När detta är aktiverat skriver modden felsökningsmeddelanden i chattfönstret.\nObservera: det blir många meddelanden :)
todolist-window-height=Höjden på att göra-listans fönster. Standardvärdet är 600.
todolist-auto-assign=Om det bara finns en spelare i spelet tilldelas uppgiften automatiskt till den spelaren.
todolist-click-edit-task=När detta är aktiverat öppnas redigeringsrutan med mittenklick. Som standard används högerklick.
todolist-translation-mode=Textstil för att göra-listan. Uppdragslogg ändrar formuleringarna så att listan blir en uppdragslogg.

